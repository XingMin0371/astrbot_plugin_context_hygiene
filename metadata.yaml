name: astrbot_plugin_context_hygiene
display_name: 节省上下文
short_desc: 图片入库短描述、旧上下文与工具清理、缓存保护
desc: 每轮只修改发给模型的上下文副本，不去数据库删记录；新图入库生成短标签、旧图默认不事后替换；清理重复提醒、旧工具前缀外内容，并在上下文过大时做无模型压缩。默认不写库，持久清理需要管理员显式开启。
version: v1.2.2
author: DSH
repo: https://github.com/XingMin0371/astrbot_plugin_context_hygiene
astrbot_version: ">=4.29.0"
tags:
  - context
  - token
  - memory
  - astrbot-plugin
